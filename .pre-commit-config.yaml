# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: end-of-file-fixer
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/osprey-oss/deptry
    rev: 0.25.1
    hooks:
      - id: deptry
        language: python
  # Note: This notebook hook is only required if the project contains Jupyter notebooks.
  # - repo: https://github.com/kynan/nbstripout
  #   rev: 0.9.1
  #   hooks:
  #     - id: nbstripout
  #       args:
  #         - "--extra-keys=metadata.kernelspec metadata.language_info"
  #         - "--drop-empty-cells"
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.9
    hooks:
      - id: prettier
        args:
          - "--tab-width=2"
  # Note: The oxipng hook is only required if the project contains PNG images
  - repo: https://github.com/shssoichiro/oxipng
    rev: v10.2.1
    hooks:
      - id: oxipng
        args:
          - "-o=max"
          - "--strip=safe"
          - "--alpha"
